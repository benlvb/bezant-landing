name: Landing

# Validates the static marketing landing page. This repo is the public site
# only, so the job is cheap (ubuntu + Node, seconds) and runs on every push
# and PR to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate landing page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize share card
        run: node -e "const fs=require('fs'); fs.writeFileSync('landing/og-image.png', Buffer.from(fs.readFileSync('landing/og-image.png.b64','utf8'),'base64'))"

      - name: Check landing page
        run: node scripts/check-landing.mjs
