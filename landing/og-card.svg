<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="mintGlow" cx="1008" cy="70" r="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35E0A1" stop-opacity="0.20"/>
      <stop offset="0.58" stop-color="#35E0A1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="70" cy="620" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA8E0" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#5EA8E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="1090" cy="120" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35E0A1" stop-opacity="0.16"/>
      <stop offset="0.95" stop-color="#35E0A1" stop-opacity="0"/>
    </radialGradient>
    <mask id="glyphBowl">
      <rect width="120" height="120" fill="#000"/>
      <circle cx="64" cy="74" r="27" fill="#fff"/>
      <circle cx="64" cy="74" r="13" fill="#000"/>
    </mask>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F8F66"/>
      <stop offset="1" stop-color="#3FCFC8"/>
    </linearGradient>
    <style>
      text{font-family:"Helvetica Neue","Helvetica","Arial",sans-serif;}
      .mono{font-family:"Menlo","SF Mono","DejaVu Sans Mono",monospace;}
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0A0C0B"/>
  <rect width="1200" height="630" fill="url(#mintGlow)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>

  <!-- top row: glyph + wordmark + pill -->
  <g transform="translate(80,68) scale(0.34)">
    <path d="M38 20 V94" stroke="#35E0A1" stroke-width="11.5" stroke-linecap="round"/>
    <circle cx="64" cy="74" r="27" fill="#35E0A1" mask="url(#glyphBowl)"/>
    <circle cx="64" cy="74" r="5" fill="#35E0A1"/>
  </g>
  <text x="134" y="103" font-size="30" font-weight="600" fill="#E9ECE8" letter-spacing="-0.9">bezant</text>
  <rect x="906" y="72" width="214" height="38" rx="19" fill="#35E0A1" fill-opacity="0.10" stroke="#35E0A1" stroke-opacity="0.34"/>
  <text class="mono" x="1013" y="97" font-size="15" fill="#35E0A1" text-anchor="middle" letter-spacing="2">FREE · PRIVATE</text>

  <!-- headline -->
  <text x="80" y="286" font-size="74" font-weight="600" fill="#E9ECE8" letter-spacing="-2.6">Saving, but make</text>
  <text x="80" y="364" font-size="74" font-weight="600" letter-spacing="-2.6" xml:space="preserve"><tspan fill="#E9ECE8">it a </tspan><tspan fill="#35E0A1">streak.</tspan></text>

  <!-- subhead -->
  <text x="80" y="430" font-size="24" fill="#8B928B">Set goals, log spends in a tap, and watch every</text>
  <text x="80" y="463" font-size="24" xml:space="preserve"><tspan fill="#8B928B">goal’s date pull closer. </tspan><tspan fill="#E9ECE8" font-weight="500">Private by default — your</tspan></text>
  <text x="80" y="496" font-size="24" font-weight="500" fill="#E9ECE8">data never leaves your phone.</text>

  <!-- bottom: iOS button + url -->
  <rect x="80" y="506" width="234" height="52" rx="15" fill="#35E0A1"/>
  <g transform="translate(100,521) scale(0.95)" fill="#04130d">
    <path d="M16.4 12.8c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.8ZM14.2 6c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.8 1 0 2-.5 2.6-1.3Z"/>
  </g>
  <text x="130" y="539" font-size="20" font-weight="650" fill="#04130d">Download for iOS</text>
  <text class="mono" x="1120" y="539" font-size="18" fill="#555C58" text-anchor="end" letter-spacing="0.4">bezant.app</text>

  <!-- phone glance -->
  <g transform="rotate(3 996 310)">
    <rect x="872" y="118" width="248" height="384" rx="40" fill="#000" stroke="#1c201d" stroke-width="1.5"/>
    <rect x="881" y="127" width="230" height="366" rx="32" fill="#0A0C0B"/>
    <rect x="881" y="127" width="230" height="366" rx="32" fill="url(#screenGlow)"/>
    <text class="mono" x="903" y="166" font-size="11" fill="#555C58" letter-spacing="1.4">TOTAL WEALTH</text>
    <text class="mono" x="903" y="202" font-size="34" font-weight="600" letter-spacing="-1"><tspan fill="#555C58">$</tspan><tspan fill="#E9ECE8">16,700</tspan></text>
    <rect x="903" y="216" width="80" height="30" rx="15" fill="#E8A23C" fill-opacity="0.14"/>
    <g transform="translate(911,222) scale(0.62)" fill="#E8A23C">
      <path d="M12 2.8C9.2 7 7 9 7 13.2a5 5 0 0 0 10 0c0-2.4-1.4-4-2.6-5.8.3 2-1 3-1.9 3.1C13 9.4 13.4 5.8 12 2.8Z"/>
    </g>
    <text class="mono" x="940" y="236" font-size="16" font-weight="700" fill="#E8A23C">47</text>
    <text x="903" y="284" font-size="13" font-weight="600" fill="#E9ECE8">Japan trip</text>
    <text class="mono" x="1089" y="284" font-size="13" font-weight="700" fill="#3FCFC8" text-anchor="end">~Nov 26</text>
    <rect x="903" y="294" width="186" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="903" y="294" width="126" height="7" rx="3.5" fill="url(#track)"/>
    <g font-size="13">
      <circle cx="908" cy="330" r="5" fill="#E8A23C"/><text x="922" y="335" fill="#8B928B">Food</text><text class="mono" x="1089" y="335" font-weight="600" fill="#E9ECE8" text-anchor="end">$300</text>
      <circle cx="908" cy="360" r="5" fill="#3FCFC8"/><text x="922" y="365" fill="#8B928B">Transport</text><text class="mono" x="1089" y="365" font-weight="600" fill="#E9ECE8" text-anchor="end">$180</text>
      <circle cx="908" cy="390" r="5" fill="#8A8AF0"/><text x="922" y="395" fill="#8B928B">Leisure</text><text class="mono" x="1089" y="395" font-weight="600" fill="#E9ECE8" text-anchor="end">$120</text>
    </g>
  </g>
</svg>
